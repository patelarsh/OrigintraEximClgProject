# ==============================================================================
# Origintra Exim - Hardened Production Nginx Reverse Proxy Configuration
# Purpose: Hide Underlying Hosting Provider, OS, and Server Fingerprints
# ==============================================================================

# 1. Hide Nginx Version and OS details from error pages and headers
server_tokens off;

# Cloudflare Real IP Restoration (Allows viewing real visitor IP while hiding hosting provider)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

# 2. Block Direct IP Access (Drop requests that do not specify the domain name)
# Prevents internet scanners (Shodan, Censys) from discovering your real host IP
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/ssl/certs/dummy.crt;
    ssl_certificate_key /etc/ssl/private/dummy.key;

    # Silently close connection without returning any header or body
    return 444;
}

# 3. Main Origintra Exim Server Block
server {
    listen 80;
    listen [::]:80;
    server_name origintra.com www.origintra.com;

    # Enforce HTTPS Redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name origintra.com www.origintra.com;

    # SSL Certificates (Cloudflare Origin Certificate or Let's Encrypt)
    ssl_certificate /etc/ssl/certs/origintra.com.crt;
    ssl_certificate_key /etc/ssl/private/origintra.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Mask Server and Strip Fingerprint Headers
    more_set_headers "Server: Origintra-Gateway";
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # Enterprise Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Server "Origintra-Gateway" always;

    # Maximum upload size for product & certificate assets
    client_max_body_size 10M;

    # Reverse Proxy to Origintra Node.js / SQLite Server (Port 5173)
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Disable buffering for real-time Server-Sent Events (/api/events)
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
}
